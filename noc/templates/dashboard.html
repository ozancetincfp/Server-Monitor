<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="60">
  <title>NOC</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
    }
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 16px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
    .critical { background: #f8d7da; }
    .warning  { background: #fff3cd; }
    .ok       { background: #d1e7dd; }
    .offline  { background: #e2e3e5; }
  </style>
</head>
<body>
  <h1>NOC – Server Status</h1>

  <table>
    <tr>
      <th>Server</th>
      <th>Status</th>
      <th>Last seen</th>
      <th>Problems</th>
    </tr>
    {% for server in servers %}
    <tr class="{{ server.status|lower }}">
      <td>{{ server.hostname }}</td>
      <td>{{ server.status }}</td>
      <td>{{ server.last_seen }}</td>
      <td>
        {% for disk in server.disks %}
          {% if disk.status != "OK" %}
            <div class="{{ disk.status|lower }}">{{ disk.mount }}: {{ disk.use_percent }}%</div>
          {% endif %}
        {% endfor %}
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
